<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>True Campus | 지역 1위 교육 기업 솔루션</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            900: '#0a192f',
                            800: '#112240',
                            700: '#233554',
                        },
                        electric: {
                            500: '#007bff',
                            400: '#3395ff',
                        },
                        slate: {
                            300: '#8892b0',
                            400: '#a8b2d1',
                            100: '#ccd6f6',
                            50: '#e6f1ff',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-navy-900 text-white font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        // Icons
        const ArrowRight = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>
        );
        const TrendingUp = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18" /><polyline points="17 6 23 6 23 12" /></svg>
        );
        const FileText = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" /><polyline points="14 2 14 8 20 8" /><line x1="16" x2="8" y1="13" y2="13" /><line x1="16" x2="8" y1="17" y2="17" /><line x1="10" x2="8" y1="9" y2="9" /></svg>
        );
        const Check = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12" /></svg>
        );
        const Search = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>
        );
        const Share2 = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="18" cy="5" r="3" /><circle cx="6" cy="12" r="3" /><circle cx="18" cy="19" r="3" /><line x1="8.59" x2="15.42" y1="13.51" y2="17.49" /><line x1="15.41" x2="8.59" y1="6.51" y2="10.49" /></svg>
        );

        // Components
        const Hero = () => {
            return (
                <section className="relative flex flex-col items-center justify-center min-h-[80vh] px-4 text-center bg-navy-900 overflow-hidden">
                    <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-electric-500/10 rounded-full blur-[120px] pointer-events-none" />
                    <div className="relative z-10 max-w-6xl mx-auto space-y-16 py-12">
                        <h1 className="text-3xl md:text-4xl lg:text-5xl font-bold tracking-tight leading-[1.6] text-white">
                            도합 7만 팔로워,<br />
                            <span className="text-electric-400">ATP 입시연구소</span>의 성공 방정식을<br />
                            적용해 드립니다.
                        </h1>
                        <p className="max-w-4xl mx-auto text-lg md:text-xl text-slate-300 leading-relaxed font-medium">
                            학생수를 지금보다 최소 2배 이상 만들어드리겠습니다.
                        </p>
                        <div className="pt-8">
                            <button
                                onClick={() => document.getElementById('contact').scrollIntoView({ behavior: 'smooth' })}
                                className="group relative inline-flex items-center gap-2 px-8 py-4 text-lg font-bold text-white bg-electric-500 rounded-full hover:bg-electric-400 transition-all duration-300 hover:shadow-[0_0_20px_rgba(0,123,255,0.4)]"
                            >
                                학원 진단받기
                                <ArrowRight className="w-5 h-5 group-hover:translate-x-1 transition-transform" />
                            </button>
                        </div>
                    </div>
                </section>
            )
        }

        const Stats = () => {
            const stats = [
                { label: "팔로워", value: "70,000+" },
                { label: "누적 조회수", value: "1,000만+" },
                { label: "재계약율", value: "98%" },
            ]
            return (
                <section className="py-12 border-y border-navy-800 bg-navy-900/50">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8 text-center">
                            {stats.map((stat, index) => (
                                <div key={index} className="space-y-2">
                                    <div className="text-3xl md:text-4xl font-bold text-white">{stat.value}</div>
                                    <div className="text-sm md:text-base text-slate-400 font-medium">{stat.label}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            )
        }

        const Partners = () => {
            const partners = [
                { name: "ATP 입시연구소", image: "./assets/atp_logo.jpg" },
                { name: "에듀플렉스", image: "./assets/eduplex_logo.jpg" },
                { name: "이대은 강사님 외 다수", image: "./assets/instructor.png" }
            ]
            return (
                <section className="py-24 bg-white">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <h2 className="text-4xl md:text-5xl font-bold text-center mb-20 text-navy-900 tracking-tight">True campus와 함께하는 학원&강사</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-12 max-w-6xl mx-auto">
                            {partners.map((partner, index) => (
                                <div key={index} className="group flex flex-col items-center text-center space-y-8">
                                    <div className="relative w-48 h-48 rounded-full overflow-hidden bg-slate-50 flex items-center justify-center shadow-xl border border-slate-100 group-hover:scale-105 transition-transform duration-500">
                                        <img src={partner.image} alt={partner.name} className="w-full h-full object-cover" />
                                        <div className="absolute inset-0 bg-black/0 group-hover:bg-black/5 transition-colors duration-300" />
                                    </div>
                                    <h3 className="text-2xl font-bold text-navy-900 group-hover:text-electric-500 transition-colors">{partner.name}</h3>
                                </div>
                            ))}
                        </div>
                        <div className="mt-16 text-center">
                            <a href="https://special-column-78d.notion.site/REFERENCE-28f96c101f1c80068432ce2cf3ea1ba6" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 text-slate-500 hover:text-electric-500 transition-colors text-lg font-medium border-b border-transparent hover:border-electric-500 pb-1">
                                더 알아보기
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>
                            </a>
                        </div>
                    </div>
                </section>
            )
        }

        const ServiceProcess = () => {
            const steps = [
                {
                    step: "STEP 01",
                    title: "전략 수립 [Strategy]",
                    desc: "마케팅 전략 수집 & 브랜드 방향성 계획",
                    detail: "학원 고유의 브랜드를 위해 설문지를 드리고, 이를 바탕으로 차별화된 마케팅 방향성을 수립합니다.",
                    icon: FileText
                },
                {
                    step: "STEP 02",
                    title: "시장 분석 [Analysis]",
                    desc: "주변 학교, 타깃 고객, 학원 성과 분석",
                    detail: "주변 학교, 타깃 고객, 학원 성과 등을 면밀히 분석하여 우리 학원만의 승리 전략을 도출합니다.",
                    icon: Search
                },
                {
                    step: "STEP 03",
                    title: "채널 운영 [Execution]",
                    desc: "유튜브, 인스타그램, 블로그 등 채널 대행",
                    detail: "유튜브, 인스타그램, 블로그 등 주요 플랫폼을 통해 학원의 강점을 매력적인 콘텐츠로 확산시킵니다.",
                    icon: Share2
                },
                {
                    step: "STEP 04",
                    title: "성과 관리 [Management]",
                    desc: "월 1회 정기 상담 & 방향성 체크",
                    detail: "월 1회 정기적인 상담을 통해 마케팅 성과를 분석하고, 콘텐츠 방향성을 지속적으로 최적화합니다.",
                    icon: TrendingUp
                }
            ]
            return (
                <section className="py-24 bg-navy-800">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="text-center mb-20">
                            <h2 className="text-3xl md:text-4xl font-bold text-white mb-4">True Campus만의 <span className="text-electric-400">4-Step 솔루션</span></h2>
                            <p className="text-slate-400">체계적인 프로세스로 확실한 성장을 약속합니다.</p>
                        </div>
                        <div className="space-y-24">
                            {steps.map((item, index) => (
                                <div key={index} className={`flex flex-col md:flex-row gap-12 items-center ${index % 2 !== 0 ? 'md:flex-row-reverse' : ''}`}>
                                    <div className="w-full md:w-1/2">
                                        <div className="relative aspect-video rounded-2xl bg-navy-900 border border-navy-700 flex items-center justify-center overflow-hidden group shadow-2xl">
                                            <div className="absolute inset-0 bg-electric-500/10 group-hover:bg-electric-500/0 transition-colors z-10" />
                                            <img
                                                src={`./assets/service_step_${index + 1}.png`}
                                                alt={item.title}
                                                className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
                                            />
                                        </div>
                                    </div>
                                    <div className="w-full md:w-1/2 space-y-6">
                                        <div className="text-electric-400 font-bold tracking-wider">{item.step}</div>
                                        <h3 className="text-3xl font-bold text-white">{item.title}</h3>
                                        <h4 className="text-xl font-semibold text-slate-200">{item.desc}</h4>
                                        <p className="text-slate-400 leading-relaxed text-lg">{item.detail}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            )
        }

        const CEOMessage = () => {
            return (
                <section className="py-24 bg-navy-900 border-t border-navy-800">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex flex-col lg:flex-row items-center gap-16">
                            {/* Image Side */}
                            <div className="w-full lg:w-1/2">
                                <div className="relative mx-auto max-w-md lg:max-w-full">
                                    <div className="absolute inset-0 bg-electric-500/20 rounded-3xl translate-x-4 translate-y-4" />
                                    <div className="relative rounded-3xl overflow-hidden shadow-2xl">
                                        <img
                                            src="./assets/ceo_profile.jpg"
                                            alt="True Campus CEO"
                                            className="w-full h-auto object-cover"
                                        />
                                    </div>
                                </div>
                            </div>

                            {/* Content Side */}
                            <div className="w-full lg:w-1/2 space-y-8">
                                <div className="space-y-4">
                                    <h2 className="text-3xl md:text-4xl font-bold text-white">
                                        "시행착오 없이,<br />
                                        <span className="text-electric-400">확실한 성장의 길</span>로 안내합니다."
                                    </h2>
                                    <div className="h-1 w-20 bg-electric-500 rounded-full" />
                                </div>

                                <div className="space-y-6 text-lg text-slate-300 leading-relaxed">
                                    <p>
                                        인스타그램으로 시작해 유튜브까지 도합 7만 팔로워 입시회사를 만들기까지 많은 시행착오가 있었습니다.
                                        콘텐츠 주제부터 촬영, 편집까지 쉽지 않습니다.
                                    </p>
                                    <p>
                                        또한, 학원은 '신뢰성'과 '전문성'이 중요하기 때문에 다른 업종 사람들과 마케팅 전략이 달랐습니다.
                                        홀로 모든 시행착오를 겪었고 그 결과 큰 매출을 내는 학원을 만들 수 있었습니다.
                                    </p>
                                    <p className="font-bold text-white text-xl">
                                        저의 경험을 토대로 원장님, 강사님들을 위해 제 마케팅 노하우를 아낌없이 제공해드리겠습니다.
                                    </p>
                                </div>

                                <div className="pt-4">
                                    <div className="text-white font-bold text-xl">True Campus 대표 올림</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            )
        }

        const ContactForm = () => {
            const [agreed, setAgreed] = React.useState(false)

            return (
                <section id="contact" className="py-24 bg-navy-900 border-t border-navy-800">
                    <div className="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="text-center mb-16">
                            <h2 className="text-3xl md:text-4xl font-bold text-white mb-4">학원 진단받기</h2>
                            <p className="text-slate-400">우리 학원에 딱 맞는 마케팅 솔루션을 제안해 드립니다.</p>
                        </div>

                        <form className="space-y-8 bg-navy-800 p-8 md:p-12 rounded-3xl border border-navy-700 shadow-xl">
                            <div className="space-y-6">
                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">성함</label>
                                    <input type="text" className="w-full px-4 py-3 rounded-xl bg-navy-900 border border-navy-600 text-white focus:border-electric-500 focus:ring-1 focus:ring-electric-500 outline-none transition-all" placeholder="홍길동" />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">전화번호</label>
                                    <input type="tel" className="w-full px-4 py-3 rounded-xl bg-navy-900 border border-navy-600 text-white focus:border-electric-500 focus:ring-1 focus:ring-electric-500 outline-none transition-all" placeholder="010-0000-0000" />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">학원 정보 (위치 / 학원이름 / 과목명)</label>
                                    <input type="text" className="w-full px-4 py-3 rounded-xl bg-navy-900 border border-navy-600 text-white focus:border-electric-500 focus:ring-1 focus:ring-electric-500 outline-none transition-all" placeholder="서울 강남구 / 트루수학학원 / 수학" />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">마케팅 어려움 및 고민사항</label>
                                    <textarea rows="4" className="w-full px-4 py-3 rounded-xl bg-navy-900 border border-navy-600 text-white focus:border-electric-500 focus:ring-1 focus:ring-electric-500 outline-none transition-all resize-none" placeholder="학원 마케팅을 진행하면서 어려웠던 점을 자세히 적어주세요.&#13;&#10;(운영 중인 유튜브, 인스타, 블로그 링크가 있다면 함께 적어주세요)" />
                                </div>
                            </div>

                            <div className="flex items-start gap-3 pt-4 border-t border-navy-700">
                                <div className="flex items-center h-5">
                                    <input
                                        id="privacy"
                                        type="checkbox"
                                        checked={agreed}
                                        onChange={(e) => setAgreed(e.target.checked)}
                                        className="w-5 h-5 rounded border-navy-600 bg-navy-900 text-electric-500 focus:ring-electric-500 focus:ring-offset-navy-800"
                                    />
                                </div>
                                <label htmlFor="privacy" className="text-sm text-slate-400">
                                    <span className="text-white font-medium">개인정보 수집 및 이용에 동의합니다.</span>
                                    <br />
                                    수집된 정보는 상담 및 서비스 안내 목적으로만 사용됩니다.
                                </label>
                            </div>

                            <button
                                type="submit"
                                className="w-full py-4 px-8 text-lg font-bold text-white bg-electric-500 rounded-xl hover:bg-electric-400 transition-all duration-300 hover:shadow-[0_0_20px_rgba(0,123,255,0.4)] disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                신청하기
                            </button>
                        </form>
                    </div>
                </section>
            )
        }

        const App = () => {
            return (
                <div className="min-h-screen bg-navy-900 text-white">
                    <Hero />
                    <Stats />
                    <Partners />
                    <ServiceProcess />
                    <CEOMessage />
                    <ContactForm />
                    <footer className="py-12 text-center text-slate-400 text-sm border-t border-navy-800">
                        <p>© 2024 True Campus. All rights reserved.</p>
                    </footer>
                </div>
            )
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
